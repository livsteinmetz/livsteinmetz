name: Preview branch

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-settings.mjs
      - run: node scripts/fetch-medium.mjs
      - run: node scripts/fetch-wall.mjs
      - run: node scripts/fetch-goodreads.mjs
      - run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: node scripts/build.mjs
        env:
          PREVIEW: '1'
      - run: node scripts/check-art.mjs
      - run: npm i --no-save playwright@1.64.0 && npx playwright install --with-deps chromium && node scripts/qa/art-refs.mjs; node scripts/qa/screens.mjs
        continue-on-error: true
      - name: Publish screenshots to a scratch branch
        continue-on-error: true
        run: |
          cd shots
          git init -q -b preview-shots
          git add -A
          git -c user.name="Olivia Steinmetz" -c user.email="46467923+livsteinmetz@users.noreply.github.com" commit -qm "preview screenshots"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview-shots
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVSTEINMETZ_BB868 }}
          channelId: preview
          expires: 30d
          projectId: livsteinmetz-bb868
          target: livsteinmetz
      - name: Check security headers and rules on the preview
        continue-on-error: true
        run: node scripts/qa/live.mjs https://livsteinmetz--preview-y8pj65y4.web.app
