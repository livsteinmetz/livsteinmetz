name: Preview branch

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-medium.mjs
      - run: node scripts/build.mjs
      - run: node scripts/check-art.mjs
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium && node .ci/shots.mjs
        continue-on-error: true
      - name: Publish screenshots to a scratch branch
        run: |
          cd shots
          git init -q -b preview-shots
          git add -A
          git -c user.name="Olivia Steinmetz" -c user.email="46467923+livsteinmetz@users.noreply.github.com" commit -qm "preview screenshots"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview-shots
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVSTEINMETZ_BB868 }}
          channelId: preview
          expires: 30d
          projectId: livsteinmetz-bb868
          target: livsteinmetz
