name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # daily, picks up new Medium posts
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-medium.mjs
      - run: node scripts/build.mjs
      - run: node scripts/check-art.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVSTEINMETZ_BB868 }}
          channelId: live
          projectId: livsteinmetz-bb868
          target: livsteinmetz
