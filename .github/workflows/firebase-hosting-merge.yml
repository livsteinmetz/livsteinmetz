name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # daily, picks up new Medium posts and listening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-settings.mjs
      - run: node scripts/fetch-medium.mjs
      - run: node scripts/fetch-wall.mjs
      - run: node scripts/fetch-goodreads.mjs
      - name: Restore the Spotify backup
        continue-on-error: true
        run: git fetch -q --depth 1 origin spotify-backup && git checkout origin/spotify-backup -- backup && ls backup
      - run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: node scripts/fetch-links.mjs
        continue-on-error: true
      - run: node scripts/fetch-weather-history.mjs
        continue-on-error: true
      - run: node scripts/fetch-world.mjs
        continue-on-error: true
      - run: node scripts/build.mjs
        env:
          LISTENING_PASSCODE: ${{ secrets.LISTENING_PASSCODE }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: node scripts/check-art.mjs
      - name: Save the Spotify backup
        continue-on-error: true
        run: |
          [ -s build/.spotify-backup.json ] || exit 0
          mkdir -p /tmp/backup/backup && cp build/.spotify-backup.json /tmp/backup/backup/spotify.json && rm build/.spotify-backup.json
          cd /tmp/backup && git init -q -b spotify-backup && git add -A
          git -c user.name="Olivia Steinmetz" -c user.email="46467923+livsteinmetz@users.noreply.github.com" commit -qm "spotify backup"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" spotify-backup
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVSTEINMETZ_BB868 }}
          channelId: live
          projectId: livsteinmetz-bb868
          target: livsteinmetz
      - name: Tell search engines about new pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: curl -sS -m 20 -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @build/indexnow.json -o /dev/null -w 'IndexNow %{http_code}\n'
      - name: Confirm the live site updated
        run: sleep 20 && curl -fsS "https://livsteinmetz.com/?deploy=$GITHUB_SHA" | grep -o "intersection of the arts and tech"
