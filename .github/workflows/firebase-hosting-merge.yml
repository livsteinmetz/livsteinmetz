name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # daily, picks up new Medium posts and listening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-settings.mjs
      - run: node scripts/fetch-medium.mjs
      - run: node scripts/fetch-wall.mjs
      - run: node scripts/fetch-goodreads.mjs
      - run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: node scripts/fetch-weather-history.mjs
        continue-on-error: true
      - run: node scripts/fetch-world.mjs
        continue-on-error: true
      - run: node scripts/build.mjs
      - run: node scripts/check-art.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVSTEINMETZ_BB868 }}
          channelId: live
          projectId: livsteinmetz-bb868
          target: livsteinmetz
      - name: Confirm the live site updated
        run: sleep 20 && curl -fsS "https://livsteinmetz.com/?deploy=$GITHUB_SHA" | grep -o "intersection of the arts and tech"
