name: Peek
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.64.0 && npx playwright install --with-deps chromium && node scripts/qa/icons.mjs refs
      - name: Fetch reference images to a scratch branch
        run: |
          mkdir -p refs && cd refs
          ls -la
          git init -q -b peek
          git add -A
          git -c user.name="Olivia Steinmetz" -c user.email="46467923+livsteinmetz@users.noreply.github.com" commit -qm "reference images"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" peek
