name: Peek
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch reference images to a scratch branch
        run: |
          mkdir -p refs && cd refs
          curl -sSfL -A 'livsteinmetz-site-build/1.0 (https://livsteinmetz.com)' -o feminine.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/L%27%C3%89ternel_F%C3%A9minin%2C_par_Paul_C%C3%A9zanne.jpg"
          curl -sSfL -A 'livsteinmetz-site-build/1.0 (https://livsteinmetz.com)' -o magdalen.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/The_Magdalen_Reading_Rogier_van_der_Weiden.jpg?width=3000"
          curl -sSfL -A 'livsteinmetz-site-build/1.0 (https://livsteinmetz.com)' -o teniers.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Landscape_with_the_flight_into_Egypt_%28David_Teniers_d.%C3%A4.%29_-_Nationalmuseum_-_23919FXD.jpg?width=3840"
          ls -la
          git init -q -b peek
          git add -A
          git -c user.name="Olivia Steinmetz" -c user.email="46467923+livsteinmetz@users.noreply.github.com" commit -qm "reference images"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" peek
